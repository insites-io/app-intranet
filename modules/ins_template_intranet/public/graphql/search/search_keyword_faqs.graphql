query search_keyword_faqs (
  $page: Int = 1,
  $size: Int = 5,
  $keyword: String,
  $schema: String,
  $status: String
) {
  records(
    page: $page, 
    per_page: , $size
  filter: {
    fulltext: {
      keyword: $keyword, 
      match_type: CONTAINS, 
      operator: OR,
      }, 
    table: {value_in: $schema}, 
    properties: {
      name: "status", value: $status,
    },
    
  }) {
    total_entries
    total_entries
    total_pages
    current_page
    has_next_page
    has_previous_page
    per_page
    results {
      id
      question: property(name: "question")
      answer: property(name: "answer")
      attachment_download: property_upload(name: "attachment"){
          url
        }
      attachment_label: property(name: "attachment_label") 
    }
  }
}
