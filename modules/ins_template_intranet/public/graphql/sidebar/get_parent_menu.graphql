query get_parent_menu(
  $database_schema: String!,
	$date_now: String
) {
  items: records(
    page: 1
    per_page: 1000
    filter: {
      deleted_at: { exists: false }
      table: { value: $database_schema }
      properties: [
        { name: "status", value: "Published" },
        { name: "show_in_sidebar", value_boolean: true },
        { name: "parent_category", exists: false }
        { name: "published_date", 
          range: {
             lte: $date_now
          }
        }
      ]
    },
    sort: {
      properties: [
        { name: "order", order: ASC }
      ]
    }
    
  ) {
    total_entries
    results {
      id
      slug: property(name: "slug")
      menu_label: property(name: "menu_label")
    }
  }
}