query get_timeline_items(
  $id: ID,
  $page: Int = 1, 
  $size: Int = 10, 
  $tag: String, 
  $status: String, 
  $range: RangeFilter,
  $slug: String
) {
  items: records(
    page: $page,
    per_page: $size,
    filter: {
      id: { value: $id },
      deleted_at: {
        exists: false
      },
      table: {
        value: "modules/intranet/timeline"
      },
      properties: [
        { name: "slug", 
          value: $slug 
        },
        {
          name: "category_tag",
          value: $tag
        },
        {
          name: "status",
          value: $status
        },
        {
          name: "published_date",
          range: $range
        }
      ]
    }
    sort: [
      { 
        properties: {
          name: "published_date",
          order: DESC
        }
      }
    ]
  ) {
    total_entries
    total_pages
    current_page
    has_next_page
    has_previous_page
    per_page
    results {
      id
      slug: property(name: "slug")
      status: property(name: "status")
      detailed_content: property(name: "detailed_content")
      author: property(name: "author")
      title: property(name: "title")
      category_tag: property(name: "category_tag")
      published_date: property(name: "published_date")
      timeline_content: property(name: "timeline_content")
      enable_details_page: property(name: "enable_details_page")
    }
  }
}