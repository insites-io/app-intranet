query get_news(
  $page: Int = 1, 
  $size: Int = 10,
	$current_date: String,
  $category: String,
  $keyword: String,
  $slug: String
) {
  items: records(
    page: $page,
    per_page: $size, 
    filter: {
      deleted_at: { exists: false }
      table: { value: "modules/ins_template_intranet/news" }, 
      properties: [
        { name: "status", value: "Published" },
        { name: "slug", value: $slug },
        { name: "category", contains: $category },
        {name: "published_date", range: {lte: $current_date },
          
      }]
      or: {
        properties: { name: "post_title", contains: $keyword }
      },
    },
    sort: [
      { properties: { name: "published_date", order: DESC } }
      { properties: { name: "order", order: ASC } }
    ]
  ) {
      total_entries
      total_pages
      current_page
      has_next_page
      has_previous_page
      results {
        status: property(name: "status")
        post_title: property(name: "post_title")
        short_text: property(name: "short_text")
        description: property(name: "description")
        slug: property(name: "slug")
        category: property(name: "category")
        author: property(name: "author")
        published_date: property(name: "published_date")
        content_block_1: property(name: "content_block_1")
        content_block_2: property(name: "content_block_2")
        image: property_upload(name: "image") {
          url
          file_name
          extension
          versions
        }
      }
    }
}